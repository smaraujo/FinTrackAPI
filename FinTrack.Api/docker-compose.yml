services:
  fintrack-api:
    build:
      context: ..
      dockerfile: FinTrack.Api/Dockerfile
    container_name: fintrack-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/fintrack.db"
    volumes:
      - fintrack-data:/app/data
    restart: unless-stopped

volumes:
  fintrack-data:
